<!DOCTYPE html>
<html lang="{{ site.lang | default: "en-US" }}">
  <head>
    <meta charset='utf-8'>
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="{{ '/assets/css/style.css?v=' | append: site.github.build_revision | relative_url }}">
    {% include head-custom.html %}

{% seo %}
  </head>

  <body>

    <header>
      <div class="container">
        <a id="a-title" href="{{ '/' | relative_url }}">
          <h1 class="site-brand"><img src="{{ '/assets/images/anybandui-banner.png' | relative_url }}" alt="AnybandUI" width="1280" height="400"></h1>
        </a>
        <nav class="site-links" aria-label="Project links">
          <a href="{{ '/' | relative_url }}"{% if page.url == '/' %} aria-current="page"{% endif %}>Home</a>
          <a href="{{ '/features/' | relative_url }}"{% if page.url == '/features/' %} aria-current="page"{% endif %}>Features</a>
          <a href="{{ '/architecture/' | relative_url }}"{% if page.url == '/architecture/' %} aria-current="page"{% endif %}>Architecture</a>
          <a href="{{ site.github.repository_url }}">GitHub</a>
        </nav>
      </div>
    </header>

    <div class="container">
      <main id="main_content">
        {{ content }}
      </main>
    </div>
  </body>
</html>
